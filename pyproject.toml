[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chaptr"
version = "0.1.1"
description = "Build independent Markdown document projects with shared variables and CSS themes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["markdown-it-py>=3,<5", "mdit-py-plugins>=0.5,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
pdf = ["WeasyPrint>=68,<70", "pypdf>=6,<7"]
dev = ["pytest>=8,<10", "pypdf>=6,<7"]

[project.scripts]
chaptr = "chaptr.cli:main"

[tool.setuptools]
include-package-data = false
packages = ["chaptr", "chaptr_docs"]

[tool.setuptools.package-dir]
chaptr = "src/chaptr"
chaptr_docs = "docs"

[tool.setuptools.package-data]
chaptr = ["themes/*.css", "manual.txt"]
chaptr_docs = ["*.md", "*.yaml", "*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]